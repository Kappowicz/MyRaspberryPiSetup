<!DOCTYPE html>
<html>
<head>
    <title>My RPi</title>
</head>
<body>
    <h1>Server status</h1>

    <div id="status-box">
        CPU temperature: <span id="temp-display">Loading...</span> &deg;C
    </div>

    <script>
        // Fetches the data
        function refreshTemp() {
            fetch('temp.json') // reads the file generated by the cron script
                .then(response => {
                    // Cache-busting (so the browser does not keep a stale copy).
                    // Real deployments use HTTP headers; here fetch is enough.
                    return response.json();
                })
                .then(data => {
                    document.getElementById('temp-display').innerText = data.temperature;
                })
                .catch(error => console.error('Error:', error));
        }

        // Run immediately, then every 10 seconds
        refreshTemp();
        setInterval(refreshTemp, 10000);
    </script>
</body>
</html>
