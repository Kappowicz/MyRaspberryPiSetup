[Journal]
# Raspberry Pi OS ustawia Storage=volatile w /usr/lib/.../40-rpi-volatile-storage.conf,
# zeby oszczedzic karte SD. Ten system stoi na SSD, wiec powod nie obowiazuje,
# a bez trwalego journala restart kasuje slad po przyczynie awarii.
# Nazwa 90-, bo drop-iny sortuja sie po nazwie i ten musi wygrac z 40-.
Storage=persistent

# Logi kontenerow tez tu wpadaja (LogDriver=journald), czyli ok. 30 MB/dobe.
# 20 GB to ponad rok historii i wciaz 5% wolnego miejsca na dysku.
SystemMaxUse=20G
SystemMaxFileSize=200M
MaxRetentionSec=1year

# Domyslnie journald gubi komunikaty powyzej 10000/30s. Limit dziala wlasnie
# wtedy, gdy cos sie sypie lawinowo - czyli kasuje dowody w momencie awarii.
# Miejsca mamy 400 GB, wiec wolimy komplet.
RateLimitIntervalSec=0
RateLimitBurst=0
