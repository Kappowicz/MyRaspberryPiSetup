[Journal]
# Raspberry Pi OS sets Storage=volatile in /usr/lib/.../40-rpi-volatile-storage.conf
# to spare the SD card. This system runs from an SSD, so that reason does not
# apply, and without a persistent journal a reboot erases the trail of whatever
# caused the failure.
# Named 90- because drop-ins sort by name and this one must win over 40-.
Storage=persistent

# Container logs land here too (LogDriver=journald), about 30 MB a day.
# 20 GB is over a year of history and still only 5% of the disk.
SystemMaxUse=20G
SystemMaxFileSize=200M
MaxRetentionSec=1year

# By default journald drops messages above 10000/30s. That limit kicks in
# exactly when something fails in an avalanche - it deletes the evidence at the
# moment of failure. There is 400 GB of space, so we prefer the full record.
RateLimitIntervalSec=0
RateLimitBurst=0
