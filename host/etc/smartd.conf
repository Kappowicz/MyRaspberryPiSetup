# Disk health history. Without it, SSD degradation only shows up as a failure.
# Results go to the journal, persistent since 2026-08-29, so they survive a reboot.
#  -a  all attributes
#  -o on / -S on  offline tests and attribute autosave
#  -s  short test daily at 02:00, long test on Saturdays at 03:00
#  -W  log a temperature change of 4 deg, warn at 35, alarm at 45
#      (the disk runs at 32 deg, min/max 19/36 - thresholds leave headroom)
# There is no mail on this machine, so we deliberately rely on the log, not -m.
DEVICESCAN -a -o on -S on -s (S/../.././02|L/../../6/03) -W 4,35,45
