# Historia zdrowia dysku. Bez tego degradacja SSD objawia sie dopiero awaria.
# Wyniki ida do journala, ktory od 2026-08-29 jest trwaly, wiec przezyja restart.
#  -a  wszystkie atrybuty
#  -o on / -S on  testy offline i autozapis atrybutow
#  -s  krotki test codziennie 02:00, dlugi w soboty 03:00
#  -W  loguj zmiane temperatury o 4 st., ostrzezenie przy 35, alarm przy 45
#      (dysk pracuje w 32 st., min/max 19/36 - progi z zapasem)
# Poczty nie ma na tej maszynie, wiec swiadomie polegamy na logu, nie na -m.
DEVICESCAN -a -o on -S on -s (S/../.././02|L/../../6/03) -W 4,35,45
