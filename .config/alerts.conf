# InfluxDB access for the data-freshness checks.
# The token is NOT here - it lives in ~/.config/secrets/influx-read.env (mode 600).
# That is what makes this file safe to commit while the secret never is.
INFLUX_URL=http://localhost:8086
# Org and bucket are site-specific; they live with the rest of them.
. "$HOME/.config/site.conf"
INFLUX_ORG="$INFLUXDB_ORG"
INFLUX_BUCKET="$INFLUXDB_BUCKET"
. "$HOME/.config/secrets/influx-read.env"
INFLUX_TOKEN="$INFLUXDB_TOKEN"
