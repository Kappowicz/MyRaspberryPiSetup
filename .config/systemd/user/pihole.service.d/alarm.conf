[Unit]
# Restart=always never produces a failed state on its own - the container would
# keep coming back up silently. The limit below makes systemd give up after
# 5 failed starts in 5 minutes, so the unit lands in "failed" and OnFailure=
# fires the notification.
OnFailure=alert@%N.service
StartLimitIntervalSec=300
StartLimitBurst=5
