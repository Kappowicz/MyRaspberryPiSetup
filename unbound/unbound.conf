# Pi-hole has no DoT of its own: its TLS options only cover the web panel.
# This unbound is purely an encrypting forwarder for the upstream leg - it does
# NOT do recursion. Reason: recursion falls back to cleartext on port 53 and
# broadcasts the home address across every authoritative server, which defeats
# the whole point of this change.
server:
    # Level 2 = operational plus a short line per query. Only what Pi-hole's
    # cache did not serve reaches unbound (about 3k/day), so this is on the
    # order of 1 MB/day. Logs go to stderr -> container -> journald, which is
    # persistent as of today.
    verbosity: 2
    logfile: ""
    # The image is minimal and ships no timezone database, so human-readable
    # timestamps always came out in UTC - next to journald's local stamp, i.e.
    # two contradictory times on one line. Unix time does not lie, and
    # journalctl --user -u unbound.service gives the readable version anyway.
    log-time-ascii: no
    # The most important of these settings: with DNSSEC and DoT errors will
    # happen, and without this you only see a bare SERVFAIL with no reason.
    log-servfail: yes
    log-local-actions: yes
    interface: 127.0.0.1@5335
    do-ip4: yes
    do-ip6: no
    do-udp: yes
    do-tcp: yes

    # Only Pi-hole talks to us, over the loopback interface.
    access-control: 127.0.0.0/8 allow
    access-control: 0.0.0.0/0 refuse

    qname-minimisation: yes
    harden-glue: yes
    harden-dnssec-stripped: yes
    edns-buffer-size: 1232
    prefetch: yes
    cache-min-ttl: 60
    cache-max-ttl: 86400

    # 256 MB cache budget, split 1:2 as the unbound documentation recommends
    # (rrset holds individual records, msg holds whole answers).
    # Manage expectations: the measured 3842 distinct domains per week fit in a
    # few MB, so this is generous headroom, not the removal of a bottleneck.
    # With 3.3 GB of free RAM it costs nothing.
    msg-cache-size: 85m
    rrset-cache-size: 170m
    num-threads: 1
    so-rcvbuf: 1m

    # Without this bundle there is nothing to validate the upstream certificate against.
    tls-cert-bundle: /etc/ssl/certs/ca-certificates.crt

forward-zone:
    name: "."
    forward-tls-upstream: yes
    # The name after # is the certificate name to verify. When TLS fails,
    # unbound REFUSES to answer instead of silently falling back to port 53.
    forward-addr: 1.1.1.1@853#cloudflare-dns.com
    forward-addr: 1.0.0.1@853#cloudflare-dns.com
    forward-addr: 9.9.9.9@853#dns.quad9.net
    forward-addr: 149.112.112.112@853#dns.quad9.net
